# Argus - сторож и авто-лечитель для Paper-серверов.
#
# Плагин бесплатный и open source. Монетизация - через хостинг, не через плагин.
# Никакой телеметрии: наружу уходят только те данные, что перечислены в сообщении.

# Полностью отключить плагин. Ничего не будет измеряться и никто не получит алертов.
enabled: true

# Сколько секунд после старта сервера не поднимать тревоги.
# В это время идёт генерация мира и метрики всегда плохие.
startup_grace_seconds: 60

# Как часто снимать метрики. 100 тиков = 5 секунд.
sample:
  interval_ticks: 100
  # Сколько тиков помнить для оценки всплесков. 240 тиков = 12 секунд.
  tick_window: 240

# Пороги деградации. Значения по умолчанию рассчитаны на сервер на 4-8 ГБ RAM.
thresholds:
  # Среднее время тика в миллисекундах. Выше 50 - сервер уже ощутимо лагает.
  warn_mspt: 45.0
  critical_mspt: 70.0
  # TPS. Ниже 17 - просадка, ниже 12 - сервер встаёт колом.
  warn_tps: 17.0
  critical_tps: 12.0
  # Доля занятой кучи, 0..1
  warn_heap_ratio: 0.80
  critical_heap_ratio: 0.92
  # Считать переполнение кучи проблемой только вместе с лагом.
  # На G1GC куча растёт лениво и 80% занятости это норма, а не давление.
  heap_needs_lag: true
  # Нормальное количество загруженных сущностей и чанков
  max_entities: 3000
  max_chunks: 4000
  # Сколько плохих замеров подряд нужно, чтобы сработала тревога.
  # Защищает от одиночных всплесков. 3 = примерно 15 секунд плохого состояния.
  samples_before_alarm: 3
  # Тик дольше этого считается всплеском. Помогает ловить короткие фризы,
  # которые минутные средние не видят.
  tick_budget_ms: 100.0
  # Сколько таких тиков в окне нужно для тревоги.
  spikes_before_alarm: 3

# Что делать при каждой проблеме. Пустой список - только сообщить.
#
# Доступные действия:
#   notify_only        - просто сообщить (безопасно)
#   unload_chunk       - выгрузить чанк, где найден виновник (обратимо,
#                        и чанк с игроком выгружен не будет)
#   trim_memory        - принудительная сборка мусора (обратимо, но бывает пауза)
#   disable_autosave   - временно отключить автосохранение (обратимо, риск потери прогресса)
#   reduce_entity_limit- изменить лимит сущностей на чанк (НЕ поддерживается API Paper)
#   remove_entities    - удалить сущности из чанка (РАЗРУШИТЕЛЬНО, выключено по умолчанию)
#   restart_server     - перезапустить сервер через панель (РАЗРУШИТЕЛЬНО, требует panel-модуля)
heal_actions:
  tps_degraded: [notify_only]
  tick_spike: [notify_only]
  high_mspt: [notify_only]
  heap_pressure: [trim_memory, notify_only]
  entity_overload: [unload_chunk, notify_only]
  chunk_overload: [unload_chunk, notify_only]

healer:
  # Через сколько тиков вернуть автосохранение, если его отключили
  autosave_restore_ticks: 1200

# Поиск виновника деградации: обход загруженных чанков.
hotspot:
  # Сколько чанков проверять за один тик. Больше - точнее, но дороже.
  # 20 чанков за тик это 1000 чанков в секунду, виновник находится за пару секунд.
  chunks_per_tick: 20
  # Сколько самых «горячих» чанков держать в отчёте
  top_chunks: 5

# Журнал инцидентов в памяти
incident_log_size: 50

# Дополнительные признаки, которые видно точно.
# Доля времени на сборку мусора, выше которой виновата память
gc_warn_percent: 8.0
# Сколько чанков в минуту смениться, выше этого виноват мир
chunk_churn_warn: 120

# Профиль по плагинам через JFR. JFR встроен в Java, ничего ставить не надо:
# он сэмплирует поток по сигналам, а не по safepoint, поэтому в ответе
# нет смещения, из-за которого обычный getStackTrace врал.
jfr:
  enabled: true
  # Снимать профиль постоянно или только во время инцидента.
  # Постоянно - видно, кто занимает время прямо сейчас.
  # Только при инциденте - накладных расходов на здоровом сервере нет.
  always_on: false
  # Как часто снимать образец, миллисекунды.
  # 10 мс - точнее, но дороже; 50 мс - компромисс.
  sample_period_ms: 50
  # Окно отчёта при постоянном профилировании, секунды
  window_seconds: 120
  # Сколько секунд снимать профиль при инциденте
  incident_window_seconds: 30
  # Сэмплировать потоки в нативном коде. Дороже всего, нужно редко.
  native_samples: false

# Telegram-уведомления. Без bot_token и chat_id плагин молча пишет в лог.
telegram:
  bot_token: ""
  chat_id: 0
  timeout_seconds: 10

notify:
  # ru | en
  language: ru
  # Как подписывать сервер в сообщениях. Пусто - взять из Paper.
  server_name: ""
