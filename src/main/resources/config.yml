# Argus - сторож и авто-лечитель для Paper-серверов.
#
# Плагин бесплатный и open source. Монетизация - через хостинг, не через плагин.
# Никакой телеметрии: наружу уходят только те данные, что перечислены в сообщении.

# Полностью отключить плагин. Ничего не будет измеряться и никто не получит алертов.
enabled: true

# Как часто снимать метрики. 100 тиков = 5 секунд.
# Слишком часто - лишняя нагрузка, слишком редко - пропустим короткий лаг.
sample:
  interval_ticks: 100

# Пороги деградации. Значения по умолчанию рассчитаны на сервер на 4-8 ГБ RAM.
thresholds:
  # Среднее время тика в миллисекундах. Выше 50 - сервер уже ощутимо лагает.
  warn_mspt: 45.0
  critical_mspt: 70.0
  # TPS. Ниже 17 - просадка, ниже 12 - сервер встаёт колом.
  warn_tps: 17.0
  critical_tps: 12.0
  # Доля занятой кучи, 0..1
  warn_heap_ratio: 0.80
  critical_heap_ratio: 0.92
  # Нормальное количество загруженных сущностей и чанков
  max_entities: 3000
  max_chunks: 4000
  # Сколько плохих замеров подряд нужно, чтобы сработала тревога.
  # Защищает от одиночных всплесков. 3 = примерно 15 секунд плохого состояния.
  samples_before_alarm: 3

# Что делать при каждой проблеме. Пустой список - только сообщить.
#
# Доступные действия:
#   notify_only        - просто сообщить (безопасно)
#   unload_chunk       - выгрузить чанк, где найден виновник (обратимо)
#   trim_memory        - принудительная сборка мусора (обратимо, но бывает пауза)
#   disable_autosave   - временно отключить автосохранение (обратимо, риск потери прогресса)
#   reduce_entity_limit- изменить лимит сущностей на чанк (НЕ поддерживается API Paper)
#   remove_entities    - удалить сущности из чанка (РАЗРУШИТЕЛЬНО, выключено по умолчанию)
#   restart_server     - перезапустить сервер через панель (РАЗРУШИТЕЛЬНО, требует panel-модуля)
heal_actions:
  tps_degraded: [notify_only, trim_memory]
  high_mspt: [notify_only, trim_memory]
  heap_pressure: [trim_memory, notify_only]
  entity_overload: [notify_only]
  chunk_overload: [notify_only]

healer:
  # Через сколько тиков вернуть автосохранение, если его отключили
  autosave_restore_ticks: 1200

# Поиск виновника деградации: обход загруженных чанков.
hotspot:
  # Сколько чанков проверять за один тик. Больше - точнее, но дороже.
  chunks_per_tick: 40
  # Сколько самых «горячих» чанков держать в отчёте
  top_chunks: 5

# Журнал инцидентов в памяти
incident_log_size: 50

# Telegram-уведомления. Без bot_token и chat_id плагин молча пишет в лог.
telegram:
  bot_token: ""
  chat_id: 0
  timeout_seconds: 10

notify:
  # ru | en
  language: ru
  # Как подписывать сервер в сообщениях. Пусто - взять из Paper.
  server_name: ""
