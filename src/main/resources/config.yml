# Argus: спасатель серверов
# Бесплатный, open source, без телеметрии.

enabled: true

# 100 тиков = 5 секунд
sample:
  interval_ticks: 100

# Значения по умолчанию подобраны для серверов на 4-8 ГБ RAM
thresholds:
  warn_mspt: 45.0
  critical_mspt: 70.0
  warn_tps: 17.0
  critical_tps: 12.0
  # Доля занятой кучи от 0 до 1
  warn_heap_ratio: 0.80
  critical_heap_ratio: 0.92
  max_entities: 3000
  max_chunks: 4000
  # Сколько плохих замеров подряд нужно для тревоги (3 = около 15 секунд)
  samples_before_alarm: 3

# Что делать при каждой проблеме. Пустой список означает «только сообщить».
#
#   notify_only         - только сообщить (безопасно)
#   unload_chunk        - выгрузить чанк с виновником
#   trim_memory         - принудительно собрать мусор (возможна короткая пауза)
#   disable_autosave    - временно отключить автосохранение (риск потерять прогресс)
heal_actions:
  tps_degraded: [notify_only, trim_memory]
  high_mspt: [notify_only, trim_memory]
  heap_pressure: [trim_memory, notify_only]
  entity_overload: [notify_only]
  chunk_overload: [notify_only]

healer:
  autosave_restore_ticks: 1200

hotspot:
  chunks_per_tick: 40
  top_chunks: 5

incident_log_size: 50

# Без bot_token и chat_id Argus просто пишет в лог
telegram:
  bot_token: ""
  chat_id: 0
  timeout_seconds: 10

notify:
  # ru | en
  language: ru
  # Пусто: имя берётся из Paper
  server_name: ""